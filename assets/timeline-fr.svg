<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-label="Chronologie : AURA, OwnAI, Piscine 42 Paris, admis a 42, NEXUS, je construis Bunny">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1424"/><stop offset="0.55" stop-color="#14213D"/><stop offset="1" stop-color="#1F6F5C"/></linearGradient>
    <linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#1F6F5C"/><stop offset=".6" stop-color="#2E8B6E"/><stop offset="1" stop-color="#5FBF8F"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="3" result="b1"/><feGaussianBlur stdDeviation="7" result="b2"/><feMerge><feMergeNode in="b2"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#E8FF3A" stroke-opacity="0.05"/></pattern>
  </defs>
  <style>
    .draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 5s ease-out both}
    .pt{animation:in .6s ease-out both}
    .pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.8s ease-out infinite}
    @keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
    @keyframes in{from{opacity:0}to{opacity:1}}
    @keyframes pulse{0%{transform:scale(1);opacity:.9}100%{transform:scale(3);opacity:0}}
  </style>
  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect width="1200" height="260" fill="url(#grid)"/>
  <path d="M40 140H1160" stroke="#1F6F5C" stroke-opacity=".35" stroke-width="4" stroke-linecap="round"/>
  <path class="draw" pathLength="1" d="M40 140H1160" fill="none" stroke="url(#ln)" stroke-width="4" stroke-linecap="round" filter="url(#glow)"/>
  <g class="pt" style="animation-delay:0.9s"><circle cx="100" cy="140" r="8" fill="#14213D" stroke="#E8FF3A" stroke-width="3" filter="url(#glow)"/><circle cx="100" cy="140" r="3.5" fill="#E8FF3A"/></g><g class="pt" style="animation-delay:1.7s"><circle cx="300" cy="140" r="8" fill="#14213D" stroke="#E8FF3A" stroke-width="3" filter="url(#glow)"/><circle cx="300" cy="140" r="3.5" fill="#E8FF3A"/></g><g class="pt" style="animation-delay:2.5s"><circle cx="500" cy="140" r="8" fill="#14213D" stroke="#E8FF3A" stroke-width="3" filter="url(#glow)"/><circle cx="500" cy="140" r="3.5" fill="#E8FF3A"/></g><g class="pt" style="animation-delay:3.3s"><circle cx="700" cy="140" r="8" fill="#14213D" stroke="#E8FF3A" stroke-width="3" filter="url(#glow)"/><circle cx="700" cy="140" r="3.5" fill="#E8FF3A"/></g><g class="pt" style="animation-delay:4.1s"><circle cx="900" cy="140" r="8" fill="#14213D" stroke="#E8FF3A" stroke-width="3" filter="url(#glow)"/><circle cx="900" cy="140" r="3.5" fill="#E8FF3A"/></g><g class="pt" style="animation-delay:4.9s"><circle class="pulse" cx="1100" cy="140" r="9" fill="none" stroke="#E8FF3A" stroke-width="2"/><circle cx="1100" cy="140" r="10" fill="#14213D" stroke="#E8FF3A" stroke-width="3" filter="url(#glow)"/><circle cx="1100" cy="140" r="3.5" fill="#E8FF3A"/></g>
  <g class="pt" style="animation-delay:0.9s" text-anchor="middle"><text font-family="Consolas, Courier New, monospace" font-size="16" font-weight="700" fill="#E8FF3A" x="100" y="110">mars 2026</text><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff" x="100" y="182">AURA, hackathon solo 48h</text><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9fb3c8" x="100" y="204">7 agents, 4 en cascade</text></g><g class="pt" style="animation-delay:1.7s" text-anchor="middle"><text font-family="Consolas, Courier New, monospace" font-size="16" font-weight="700" fill="#E8FF3A" x="300" y="110">juil. 2026</text><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff" x="300" y="182">OwnAI, GPT de zéro</text><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9fb3c8" x="300" y="204">NumPy, 1 055 488 params</text></g><g class="pt" style="animation-delay:2.5s" text-anchor="middle"><text font-family="Consolas, Courier New, monospace" font-size="16" font-weight="700" fill="#E8FF3A" x="500" y="110">août 2026</text><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff" x="500" y="182">Piscine 42 Paris</text><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9fb3c8" x="500" y="204">26/26 jours, exam 87/100</text></g><g class="pt" style="animation-delay:3.3s" text-anchor="middle"><text font-family="Consolas, Courier New, monospace" font-size="16" font-weight="700" fill="#E8FF3A" x="700" y="110">08/09/2026</text><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff" x="700" y="182">Admis à 42 Paris</text></g><g class="pt" style="animation-delay:4.1s" text-anchor="middle"><text font-family="Consolas, Courier New, monospace" font-size="16" font-weight="700" fill="#E8FF3A" x="900" y="110">oct. 2026</text><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff" x="900" y="182">Runtime d'agents NEXUS</text><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9fb3c8" x="900" y="204">692 tests, en local</text></g><g class="pt" style="animation-delay:4.9s" text-anchor="middle"><text font-family="Consolas, Courier New, monospace" font-size="16" font-weight="700" fill="#E8FF3A" x="1100" y="110">Maintenant</text><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#ffffff" x="1100" y="182">Je construis Bunny</text><text font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14" font-weight="400" fill="#9fb3c8" x="1100" y="204">un coach IA</text></g>
</svg>
