<svg xmlns="http://www.w3.org/2000/svg" width="210" height="56" viewBox="0 0 210 56" role="img" aria-label="LinkedIn">
<defs><linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#14213D"/><stop offset="1" stop-color="#1F6F5C"/></linearGradient>
